    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        }

        /* Hiệu ứng ô nhập liệu trực tiếp trên giao diện */
        .editable-field {
            outline: none;
            border-bottom: 1.5px dashed #94a3b8;
            transition: all 0.2s ease;
            border-radius: 6px;
            padding: 2px 6px;
            margin-left: -6px;
            cursor: text;
            min-height: 28px;
        }

        .editable-field:hover {
            background-color: #eff6ff;
            border-bottom-color: #2563eb;
        }

        .editable-field:focus {
            background-color: #ffffff;
            border-bottom: 2px solid #1d4ed8;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
        }

        /* Hiển thị chữ gợi ý mờ khi người dùng xóa trống */
        .editable-field:empty::before {
            content: attr(data-placeholder);
            color: #94a3b8;
            font-weight: 400;
            font-style: italic;
        }

        /* Khi xuất file HTML hoàn chỉnh thì ẩn khung viền chỉnh sửa */
        body.exported-mode .editable-field {
            border-bottom: none;
            padding: 0;
            margin-left: 0;
            cursor: default;
        }
        body.exported-mode .editable-field:hover {
            background-color: transparent;
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-slate-800 exported-mode">

    <!-- Thanh hướng dẫn nhanh (sẽ tự động ẩn khi xuất file) -->
    

    <!-- THẺ HỒ SƠ CHÍNH -->
    <main id="profile-card" class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden">
        
        <!-- Banner đầu thẻ tông Xanh Navy Quân Đội -->
        <div class="h-32 bg-gradient-to-r from-slate-900 via-blue-950 to-blue-900 relative flex items-start justify-between p-4">
            <span class="inline-flex items-center gap-1.5 bg-white/15 backdrop-blur-sm text-white text-xs font-medium px-3 py-1 rounded-full border border-white/10">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                Hồ sơ cá nhân
            </span>
        </div>

        <!-- Phần nội dung bên dưới -->
        <div class="px-5 sm:px-7 pb-7 -mt-16 relative">
            
            <!-- 1. KHUNG GHÉP ẢNH ĐẠI DIỆN & HỌ TÊN -->
            <div class="flex flex-col items-center text-center mb-6">
